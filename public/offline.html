<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HRMS - Offline</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f3f5fb; font-family: Arial, Helvetica, sans-serif; color:#0f172a; text-align:center; padding:24px; box-sizing:border-box; }
    .box { max-width:340px; }
    img { width:72px; height:72px; border-radius:16px; margin-bottom:14px; }
    h1 { font-size:20px; margin:0 0 8px; }
    p { color:#64748b; font-size:14px; line-height:1.5; margin:0 0 18px; }
    button { background:#2563eb; color:#fff; border:0; border-radius:10px; padding:11px 22px; font-size:14px; font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/icons/icon-192.png" alt="HRMS">
    <h1>You are offline</h1>
    <p>HRMS needs an internet connection to show your latest attendance, leave and payslips. Please check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
